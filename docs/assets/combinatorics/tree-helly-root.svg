<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
<title id="title">Rooted-tree Helly argument</title>
<desc id="desc">A rooted tree has three highlighted connected subtrees. Their nearest vertices are a, n1, and v, in increasing depth. The vertex v lies in all three; their intersection consists exactly of v.</desc>
<style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{fill:none;stroke:#475569;stroke-width:3}.dash{stroke-dasharray:9 6}.red{fill:none;stroke:#c9363d;stroke-width:4}.blue{fill:none;stroke:#2861b5;stroke-width:4}.green{fill:none;stroke:#16816b;stroke-width:4}.v{fill:#fff;stroke:#334155;stroke-width:2.5}.txt{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.redtxt{fill:#c9363d}.bluetxt{fill:#2861b5}</style>
<rect class="panel" x="10" y="10" width="1060" height="520" rx="14"/><text class="ttl" x="540" y="48">The deepest nearest vertex lies in every subtree</text><line class="edge" x1="410" y1="450" x2="410" y2="365"/><line class="edge" x1="410" y1="365" x2="410" y2="275"/><line class="edge" x1="410" y1="275" x2="410" y2="185"/><line class="edge" x1="410" y1="185" x2="285" y2="90"/><line class="edge" x1="410" y1="185" x2="535" y2="90"/><line class="edge" x1="410" y1="275" x2="240" y2="210"/><line class="edge" x1="410" y1="365" x2="655" y2="330"/><g fill="none" stroke="#16816b" stroke-width="17" stroke-linecap="round" opacity="0.45"><line x1="410" y1="365" x2="410" y2="275"/><line x1="410" y1="275" x2="410" y2="185"/><line x1="410" y1="185" x2="535" y2="90"/><line x1="410" y1="365" x2="655" y2="330"/></g><g fill="none" stroke="#2861b5" stroke-width="12" stroke-linecap="round" opacity="0.65"><line x1="410" y1="275" x2="410" y2="185"/><line x1="410" y1="185" x2="285" y2="90"/><line x1="410" y1="275" x2="240" y2="210"/></g><g fill="none" stroke="#c9363d" stroke-width="6" stroke-linecap="round" opacity="0.95"><line x1="410" y1="185" x2="285" y2="90"/><line x1="410" y1="185" x2="535" y2="90"/></g><circle class="v" cx="410" cy="450" r="9"/><circle class="v" cx="410" cy="365" r="9"/><circle class="v" cx="410" cy="275" r="9"/><circle class="v" cx="410" cy="185" r="9"/><circle class="v" cx="285" cy="90" r="9"/><circle class="v" cx="535" cy="90" r="9"/><circle class="v" cx="240" cy="210" r="9"/><circle class="v" cx="655" cy="330" r="9"/><text class="txt" x="410" y="484">root r</text><text class="txt" x="330" y="378">n(S₂)</text><text class="txt" x="480" y="278">n(S₁)</text><text class="txt redtxt" x="520" y="181">n(S₀) = v*</text><text class="small" x="690" y="375">branch in S₂</text><text class="ttl" x="840" y="96">Nearest vertices</text><text class="txt redtxt" x="850" y="149">S₀ (red): v*</text><text class="txt bluetxt" x="850" y="194">S₁ (blue): n(S₁)</text><text class="txt" x="850" y="239">S₂ (green): n(S₂)</text><text class="small" x="820" y="319">depth(n(S₂)) &lt; depth(n(S₁))</text><text class="small" x="820" y="345">&lt; depth(v*)</text><text class="txt" x="800" y="409">S₀ ∩ S₁ ∩ S₂ = {v*}</text>
</svg>
