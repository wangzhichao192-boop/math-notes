<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
<title id="title">Tree-clique Ramsey formula</title><desc id="desc">For m=4 and n=3, two red triangles with all cross edges blue avoid a red four-vertex tree and a blue triangle. The embedding panel adds an unused neighbour to represent a tree leaf.</desc><style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{fill:none;stroke:#94a3b8;stroke-width:2.5}.red{stroke:#c9363d;stroke-width:4;fill:none}.blue{stroke:#2861b5;stroke-width:3;fill:none}.green{stroke:#16816b;stroke-width:5;fill:none}.dash{stroke-dasharray:8 5}.v{fill:#fff;stroke:#334155;stroke-width:2.5}.new{fill:#dcfce7;stroke:#16816b;stroke-width:3}.txt{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.redtxt{fill:#c9363d}.bluetxt{fill:#2861b5}</style>
<rect class="panel" x="10" y="10" width="520" height="420" rx="14"/><rect class="panel" x="545" y="10" width="525" height="420" rx="14"/><text class="ttl" x="270" y="48">Lower bound: m = 4, n = 3</text><text class="ttl" x="807" y="48">Extend the embedding at a leaf</text><line class="blue" x1="120" y1="130" x2="420" y2="130"/><line class="blue" x1="120" y1="130" x2="490" y2="230"/><line class="blue" x1="120" y1="130" x2="420" y2="330"/><line class="blue" x1="50" y1="230" x2="420" y2="130"/><line class="blue" x1="50" y1="230" x2="490" y2="230"/><line class="blue" x1="50" y1="230" x2="420" y2="330"/><line class="blue" x1="120" y1="330" x2="420" y2="130"/><line class="blue" x1="120" y1="330" x2="490" y2="230"/><line class="blue" x1="120" y1="330" x2="420" y2="330"/><line class="red" x1="120" y1="130" x2="50" y2="230"/><line class="red" x1="120" y1="130" x2="120" y2="330"/><line class="red" x1="50" y1="230" x2="120" y2="330"/><circle class="v" cx="120" cy="130" r="9"/><circle class="v" cx="50" cy="230" r="9"/><circle class="v" cx="120" cy="330" r="9"/><line class="red" x1="420" y1="130" x2="490" y2="230"/><line class="red" x1="420" y1="130" x2="420" y2="330"/><line class="red" x1="490" y1="230" x2="420" y2="330"/><circle class="v" cx="420" cy="130" r="9"/><circle class="v" cx="490" cy="230" r="9"/><circle class="v" cx="420" cy="330" r="9"/><text class="small" x="120" y="102">red K₃</text><text class="small" x="420" y="102">red K₃</text><text class="small" x="270" y="385">No red 4-vertex tree; no blue K₃</text><text class="small" x="270" y="411">A blue clique takes ≤ 1 vertex from each part</text><line class="edge" x1="730" y1="230" x2="615" y2="150"/><line class="edge" x1="730" y1="230" x2="615" y2="310"/><line class="green dash" x1="730" y1="230" x2="945" y2="230"/><circle class="v" cx="615" cy="150" r="9"/><text class="txt" x="611" y="125">used</text><circle class="v" cx="615" cy="310" r="9"/><text class="txt" x="615" y="340">used</text><circle class="v" cx="730" cy="230" r="9"/><text class="txt" x="730" y="198">v represents y</text><circle class="new" cx="945" cy="230" r="9"/><text class="txt" x="945" y="264">unused neighbour</text><text class="txt" x="807" y="350">deg(v) ≥ m − 1</text><text class="small" x="807" y="383">at most m − 2 neighbours already used</text><text class="small" x="807" y="412">the unused vertex represents the new leaf z</text>
</svg>
