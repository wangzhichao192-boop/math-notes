<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">A weighted graph and the spanning tree selected by Kruskal's algorithm</title>
  <desc id="desc">The left panel is a weighted graph on six vertices. The right panel shows the five edges of weights one, two, two, three, and four selected by Kruskal's algorithm.</desc>
  <defs>
    <style>
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:3;fill:none}.mst{stroke:#0f766e;stroke-width:6;fill:none}.v{fill:#fff;stroke:#0f172a;stroke-width:3}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a}.lbl{font:18px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.w{font:600 17px system-ui,sans-serif;fill:#be123c;paint-order:stroke;stroke:#fff;stroke-width:5}
    </style>
  </defs>
  <rect class="panel" x="15" y="15" width="530" height="400" rx="16"/><rect class="panel" x="575" y="15" width="530" height="400" rx="16"/>
  <text class="ttl" x="280" y="48" text-anchor="middle">Weighted graph</text><text class="ttl" x="840" y="48" text-anchor="middle">Kruskal tree</text>
  <g transform="translate(0,10)">
    <path class="edge" d="M90 205L200 80L330 100L385 235L245 325L105 330Z M200 80L245 325M200 80L385 235M330 100L245 325M90 205L245 325"/>
    <path class="mst" d="M90 205L200 80L330 100L385 235L245 325L105 330"/>
    <text class="w" x="135" y="132">2</text><text class="w" x="264" y="78">1</text><text class="w" x="370" y="156">4</text><text class="w" x="330" y="292">2</text><text class="w" x="170" y="350">3</text><text class="w" x="76" y="278">5</text><text class="w" x="230" y="208">6</text><text class="w" x="300" y="155">7</text><text class="w" x="294" y="235">8</text><text class="w" x="160" y="270">9</text>
    <g><circle class="v" cx="90" cy="205" r="12"/><circle class="v" cx="200" cy="80" r="12"/><circle class="v" cx="330" cy="100" r="12"/><circle class="v" cx="385" cy="235" r="12"/><circle class="v" cx="245" cy="325" r="12"/><circle class="v" cx="105" cy="330" r="12"/></g>
    <text class="lbl" x="70" y="205">A</text><text class="lbl" x="200" y="55">B</text><text class="lbl" x="340" y="78">C</text><text class="lbl" x="410" y="240">D</text><text class="lbl" x="250" y="360">E</text><text class="lbl" x="80" y="360">F</text>
  </g>
  <g transform="translate(560,10)">
    <path class="mst" d="M90 205L200 80L330 100L385 235L245 325L105 330"/>
    <text class="w" x="135" y="132">2</text><text class="w" x="264" y="78">1</text><text class="w" x="370" y="156">4</text><text class="w" x="330" y="292">2</text><text class="w" x="170" y="350">3</text>
    <g><circle class="v" cx="90" cy="205" r="12"/><circle class="v" cx="200" cy="80" r="12"/><circle class="v" cx="330" cy="100" r="12"/><circle class="v" cx="385" cy="235" r="12"/><circle class="v" cx="245" cy="325" r="12"/><circle class="v" cx="105" cy="330" r="12"/></g>
    <text class="lbl" x="70" y="205">A</text><text class="lbl" x="200" y="55">B</text><text class="lbl" x="340" y="78">C</text><text class="lbl" x="410" y="240">D</text><text class="lbl" x="250" y="360">E</text><text class="lbl" x="80" y="360">F</text>
  </g>
  <text class="lbl" x="840" y="395">Total weight 1 + 2 + 2 + 3 + 4 = 12</text>
</svg>
