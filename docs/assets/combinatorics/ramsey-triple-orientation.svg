<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
<title id="title">Signs of a planar orientation determinant</title>
<desc id="desc">Horizontal coordinates increase left to right and the y-axis points upward. The middle point lies below the endpoint line in the positive case and above it in the negative case.</desc>
<style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{fill:none;stroke:#475569;stroke-width:3}.dash{stroke-dasharray:9 6}.red{fill:none;stroke:#c9363d;stroke-width:4}.blue{fill:none;stroke:#2861b5;stroke-width:4}.green{fill:none;stroke:#16816b;stroke-width:4}.v{fill:#fff;stroke:#334155;stroke-width:2.5}.txt{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.redtxt{fill:#c9363d}.bluetxt{fill:#2861b5}</style>
<rect class="panel" x="10" y="10" width="520" height="420" rx="14"/><rect class="panel" x="550" y="10" width="520" height="420" rx="14"/><text class="ttl" x="270" y="49">Positive determinant</text><text class="ttl" x="810" y="49">Negative determinant</text><line class="edge" x1="70" y1="355" x2="480" y2="355"/><line class="edge" x1="70" y1="355" x2="70" y2="90"/><text class="small" x="485" y="362">x</text><text class="small" x="70" y="83">y</text><line class="edge dash" x1="100" y1="260" x2="440" y2="260"/><line class="red" x1="100" y1="260" x2="270" y2="320"/><line class="red" x1="270" y1="320" x2="440" y2="260"/><circle class="v" cx="100" cy="260" r="9"/><text class="txt" x="100" y="238">P₁</text><circle class="v" cx="270" cy="320" r="9"/><text class="txt" x="270" y="346">P₂</text><circle class="v" cx="440" cy="260" r="9"/><text class="txt" x="440" y="238">P₃</text><text class="txt redtxt" x="270" y="391">P₂ below P₁P₃; Δ &gt; 0</text><line class="edge" x1="610" y1="355" x2="1020" y2="355"/><line class="edge" x1="610" y1="355" x2="610" y2="90"/><text class="small" x="1025" y="362">x</text><text class="small" x="610" y="83">y</text><line class="edge dash" x1="640" y1="260" x2="980" y2="260"/><line class="blue" x1="640" y1="260" x2="810" y2="115"/><line class="blue" x1="810" y1="115" x2="980" y2="260"/><circle class="v" cx="640" cy="260" r="9"/><text class="txt" x="640" y="238">P₁</text><circle class="v" cx="810" cy="115" r="9"/><text class="txt" x="810" y="93">P₂</text><circle class="v" cx="980" cy="260" r="9"/><text class="txt" x="980" y="238">P₃</text><text class="txt bluetxt" x="810" y="391">P₂ above P₁P₃; Δ &lt; 0</text>
</svg>
