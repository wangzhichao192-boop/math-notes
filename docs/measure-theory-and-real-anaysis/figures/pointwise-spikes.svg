<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="title desc"><title id="title">Pointwise but not uniform convergence</title><desc id="desc">Three triangular spikes shrink towards the excluded endpoint zero, with their supremum remaining one.</desc><rect width="760" height="280" rx="10" fill="#fcfaf5"/><g fill="none" stroke="#514d46" stroke-width="1.7"><path d="M65 225H710M65 225V25"/><path d="M65 50L675 225H685" stroke="#ac6839" stroke-width="2.7"/><path d="M65 50L370 225H685" stroke="#3b7e70" stroke-width="2.7"/><path d="M65 50L217.5 225H685" stroke="#875d84" stroke-width="2.7"/><circle cx="65" cy="50" r="5" fill="#fcfaf5"/><text x="37" y="55" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >1</text><text x="45" y="246" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >0</text><text x="670" y="250" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >1</text><text x="357" y="250" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >1/2</text><text x="203" y="250" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >1/4</text><text x="702" y="250" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >x</text><text x="480" y="68" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >fₙ(x) = max{1 − nx, 0}</text><text x="480" y="98" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >0 &lt; x ≤ 1</text><text x="480" y="128" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >sup fₙ = 1</text></g></svg>
