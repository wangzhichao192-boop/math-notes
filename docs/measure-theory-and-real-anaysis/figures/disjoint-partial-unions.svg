<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">Finite partial unions of disjoint sets</title>
  <desc id="desc">Three separated schematic sets A1, A2, A3 are grouped successively in B1, B2, B3. Their measures add because they are disjoint.</desc>
  <rect width="760" height="230" rx="10" fill="#fcfaf5"/>
  <g font-family="Georgia,serif" font-size="20" text-anchor="middle" fill="#514d46">
    <g stroke="#3b7e70" stroke-width="2" fill="#e6eeea">
      <rect x="90" y="35" width="100" height="65" rx="5"/>
      <rect x="280" y="35" width="100" height="65" rx="5"/>
      <rect x="470" y="35" width="100" height="65" rx="5"/>
    </g>
    <text x="140" y="75">A₁</text><text x="330" y="75">A₂</text><text x="520" y="75">A₃</text>
    <text x="635" y="75">⋯</text>
    <g fill="none" stroke-width="2">
      <path d="M90 114v8h100v-8" stroke="#ac6839"/>
      <path d="M90 142v8h290v-8" stroke="#3b7e70"/>
      <path d="M90 170v8h480v-8" stroke="#875d84"/>
    </g>
    <text x="213" y="127" text-anchor="start" font-size="17">B₁</text>
    <text x="403" y="155" text-anchor="start" font-size="17">B₂</text>
    <text x="593" y="183" text-anchor="start" font-size="17">B₃</text>
    <text x="380" y="215" font-size="17">Bₙ = A₁ ∪ ⋯ ∪ Aₙ,   Bₙ ⊆ Bₙ₊₁</text>
  </g>
</svg>
