<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">Cosine windows</title><desc id="desc">The sector from minus pi over three to pi over three has cosine at least one half. Translation by two pi n and the substitution theta equals one over x squared select the cells I n.</desc><rect width="760" height="290" rx="10" fill="#fcfaf5"/><g fill="none" stroke="#514d46" stroke-width="1.7"><path d="M25 140H285M150 260V25"/><circle cx="150" cy="140" r="100"/><path d="M150 140L200 53.397A100 100 0 0 1 200 226.603Z" fill="#d3e4df" stroke="#3b7e70"/><path d="M200 53.397V226.603" stroke-dasharray="4 4"/><text x="195" y="44" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >π/3</text><text x="196" y="247" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >−π/3</text><text x="205" y="159" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >1/2</text><text x="275" y="160" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >cos θ</text><text x="155" y="25" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >sin θ</text><text x="370" y="44" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >cos θ ≥ 1/2 near θ = 2πn</text><path d="M360 175H725"/><path d="M410 168V182M510 168V182M610 168V182" stroke-width="3"/><text x="385" y="150" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >sₙ</text><text x="490" y="150" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >2πn</text><text x="593" y="150" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >tₙ</text><path d="M410 175H610" stroke="#3b7e70" stroke-width="7"/><text x="365" y="217" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >θ = 1/x² reverses the endpoints</text><text x="365" y="251" fill="#514d46" stroke="none" font-family="Georgia,serif" font-size="17" >Iₙ = [1/√tₙ, 1/√sₙ]</text></g></svg>
