site_name: Wu's Maths-Wiki
site_description: 个人数学笔记站
site_url: https://wangzhichao192-boop.github.io/math-notes/
copyright: CC BY-SA 4.0

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/katex.js
  - javascripts/numbering.js

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - zh
        - en
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      fallback_to_build_date: true

hooks:
  - hooks/recent_updates.py

nav:
  - 首页: index.md
  - 最近更新: recent-updates.md
  - 代数与分析基础:
      - algebra-analysis/index.md
      - Basic Logic: algebra-analysis/basic-logic.md
      - Set Theory: algebra-analysis/set-theory.md
      - Correspondence: algebra-analysis/correspondence.md
      - Binary Relations: algebra-analysis/binary-relations.md
      - Groups: algebra-analysis/groups.md
      - Rings and Modules: algebra-analysis/rings-and-modules.md
      - Limit: algebra-analysis/limit.md
      - Topology: algebra-analysis/topology.md
      - Differential Calculus: algebra-analysis/differential-calculus.md
      - Integral Calculus: algebra-analysis/integral-calculus.md
      - Category Theory: algebra-analysis/category-theory.md
      - Bilinear Algebra: algebra-analysis/bilinear-algebra.md
      - Self-adjoint Operators: algebra-analysis/self-adjoint-operators.md
      - Multilinear Algebra: algebra-analysis/multilinear-algebra.md
      - Haar Measures: algebra-analysis/haar-measures.md
      - Reduction of Endomorphisms: algebra-analysis/reduction-of-endomorphisms.md
      - Differential Geometry: algebra-analysis/differential-geometry.md
      - Fourier Series: algebra-analysis/fourier-series.md
  - 几何与拓扑:
      - geometry-topology/index.md
      - Invitation: geometry-topology/invitation.md
      - General Topology: geometry-topology/general-topology.md
      - Homotopy and Fundamental Groups: geometry-topology/homotopy-and-fundamental-groups.md
      - Projective Geometry: geometry-topology/projective-geometry.md
      - Differential Geometry: geometry-topology/differential-geometry.md
      - Hyperbolic Geometry: geometry-topology/hyperbolic-geometry.md
  - 概率论:
      - probability/index.md
      - Lesson 1: probability/lesson1.md
  - 数理逻辑:
      - mathematical-logic/index.md
      - Counting to Infinity: mathematical-logic/counting-to-infinity.md
      - First-order Logic: mathematical-logic/first-order-logic.md
      - Quantifier Elimination: mathematical-logic/quantifier-elimination.md
      - QE for ACF and Ax: mathematical-logic/qe-acf-ax.md
      - Fundamental Theorems: mathematical-logic/fundamental-theorems.md
      - Ultraproducts: mathematical-logic/ultraproducts.md
      - RCF and Hilbert 17th: mathematical-logic/rcf-hilbert.md
  - 参考:
      - 写作指南: WRITING_GUIDE.md
