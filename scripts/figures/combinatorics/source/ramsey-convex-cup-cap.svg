<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc">
<title id="title">Homogeneous cup and cap</title>
<desc id="desc">Five points on the parabola y=x squared have all ordered triple determinants positive; reflecting in a horizontal axis makes them negative. Each chain and the endpoint chord forms its convex hull.</desc>
<style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{fill:none;stroke:#475569;stroke-width:3}.dash{stroke-dasharray:9 6}.red{fill:none;stroke:#c9363d;stroke-width:4}.blue{fill:none;stroke:#2861b5;stroke-width:4}.green{fill:none;stroke:#16816b;stroke-width:4}.v{fill:#fff;stroke:#334155;stroke-width:2.5}.txt{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.redtxt{fill:#c9363d}.bluetxt{fill:#2861b5}</style>
<rect class="panel" x="10" y="10" width="520" height="380" rx="14"/><rect class="panel" x="550" y="10" width="520" height="380" rx="14"/><text class="ttl" x="270" y="48">Cup: every Δ &gt; 0</text><text class="ttl" x="810" y="48">Cap: every Δ &lt; 0</text><polygon points="110,117.14285714285714 190,254.28571428571428 270,300 350,254.28571428571428 430,117.14285714285714" fill="#fee2e2" opacity=".7"/><line class="red" x1="110" y1="117.14285714285714" x2="190" y2="254.28571428571428"/><line class="red" x1="190" y1="254.28571428571428" x2="270" y2="300"/><line class="red" x1="270" y1="300" x2="350" y2="254.28571428571428"/><line class="red" x1="350" y1="254.28571428571428" x2="430" y2="117.14285714285714"/><line class="edge dash" x1="110" y1="117.14285714285714" x2="430" y2="117.14285714285714"/><circle class="v" cx="110" cy="117.14285714285714" r="9"/><text class="txt" x="110" y="146.14285714285714">Q₁</text><circle class="v" cx="190" cy="254.28571428571428" r="9"/><text class="txt" x="190" y="283.2857142857143">Q₂</text><circle class="v" cx="270" cy="300" r="9"/><text class="txt" x="270" y="329">Q₃</text><circle class="v" cx="350" cy="254.28571428571428" r="9"/><text class="txt" x="350" y="283.2857142857143">Q₄</text><circle class="v" cx="430" cy="117.14285714285714" r="9"/><text class="txt" x="430" y="146.14285714285714">Q₅</text><text class="small" x="270" y="365">every chosen point is a hull vertex</text><polygon points="650,302.8571428571429 730,165.71428571428572 810,120 890,165.71428571428572 970,302.8571428571429" fill="#dbeafe" opacity=".7"/><line class="blue" x1="650" y1="302.8571428571429" x2="730" y2="165.71428571428572"/><line class="blue" x1="730" y1="165.71428571428572" x2="810" y2="120"/><line class="blue" x1="810" y1="120" x2="890" y2="165.71428571428572"/><line class="blue" x1="890" y1="165.71428571428572" x2="970" y2="302.8571428571429"/><line class="edge dash" x1="650" y1="302.8571428571429" x2="970" y2="302.8571428571429"/><circle class="v" cx="650" cy="302.8571428571429" r="9"/><text class="txt" x="650" y="280.8571428571429">Q₁</text><circle class="v" cx="730" cy="165.71428571428572" r="9"/><text class="txt" x="730" y="143.71428571428572">Q₂</text><circle class="v" cx="810" cy="120" r="9"/><text class="txt" x="810" y="98">Q₃</text><circle class="v" cx="890" cy="165.71428571428572" r="9"/><text class="txt" x="890" y="143.71428571428572">Q₄</text><circle class="v" cx="970" cy="302.8571428571429" r="9"/><text class="txt" x="970" y="280.8571428571429">Q₅</text><text class="small" x="810" y="365">every chosen point is a hull vertex</text>
</svg>
