<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" role="img" aria-labelledby="title"><title id="title">A vertex represents an external collection</title><style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#e8f3f1;stroke:#4f8b83;stroke-width:2}.node{fill:white;stroke:#334155;stroke-width:2}.line{stroke:#345d78;stroke-width:2.5;fill:none}.arrow{stroke:#345d78;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.title{font:600 24px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.text{font:21px system-ui,sans-serif;fill:#334155;text-anchor:middle}.math{font:25px Georgia,serif;fill:#0f172a;text-anchor:middle}.small{font:18px system-ui,sans-serif;fill:#475569;text-anchor:middle}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#345d78"/></marker></defs><rect x="10" y="10" width="740" height="365" rx="12" class="panel"/><text x="380" y="52" class="title">A vertex is not its external element collection</text><ellipse cx="380" cy="265" rx="230" ry="70" fill="#f5efe4" stroke="#aa9168" stroke-width="2" stroke-dasharray="6 5"/><path class="arrow" d="M 360 143 L 257 244"/><path class="arrow" d="M 400 143 L 503 244"/><circle class="node" cx="380" cy="120" r="27"/><text x="380" y="128" class="math">a</text><circle class="node" cx="240" cy="265" r="27"/><text x="240" y="273" class="math">b</text><circle class="node" cx="520" cy="265" r="27"/><text x="520" y="273" class="math">c</text><text x="380" y="361" class="small">Arrows encode membership; the boundary groups elements.</text></svg>