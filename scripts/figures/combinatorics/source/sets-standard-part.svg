<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title"><title id="title">A conditional external view of nonstandard finite ordinals</title><style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#e8f3f1;stroke:#4f8b83;stroke-width:2}.node{fill:white;stroke:#334155;stroke-width:2}.line{stroke:#345d78;stroke-width:2.5;fill:none}.arrow{stroke:#345d78;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.title{font:600 24px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.text{font:21px system-ui,sans-serif;fill:#334155;text-anchor:middle}.math{font:25px Georgia,serif;fill:#0f172a;text-anchor:middle}.small{font:18px system-ui,sans-serif;fill:#475569;text-anchor:middle}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#345d78"/></marker></defs><rect x="10" y="10" width="740" height="490" rx="12" class="panel"/><text x="380" y="52" class="title">External standardness and internal finiteness</text><text x="380" y="100" class="text">Standard finite ordinals</text><path class="arrow" d="M 70 155 L 690 155"/><circle cx="100" cy="155" r="5" fill="#345d78"/><text x="100" y="192" class="math">0</text><circle cx="220" cy="155" r="5" fill="#345d78"/><text x="220" y="192" class="math">1</text><circle cx="340" cy="155" r="5" fill="#345d78"/><text x="340" y="192" class="math">2</text><circle cx="460" cy="155" r="5" fill="#345d78"/><text x="460" y="192" class="math">3</text><text x="585" y="150" class="math">…</text><text x="380" y="257" class="text">Possible nonstandard finite ordinals</text><path class="arrow" d="M 70 310 L 690 310"/><circle cx="220" cy="310" r="5" fill="#345d78"/><text x="220" y="352" class="math">μ</text><circle cx="380" cy="310" r="5" fill="#345d78"/><text x="380" y="352" class="math">μ + 1</text><circle cx="540" cy="310" r="5" fill="#345d78"/><text x="540" y="352" class="math">(μ + 1) + 1</text><text x="110" y="300" class="math">…</text><text x="650" y="300" class="math">…</text><text x="380" y="402" class="small">Every standard finite ordinal lies below this region.</text><text x="380" y="437" class="small">No first nonstandard finite ordinal exists externally.</text><text x="380" y="472" class="small">The two rows are schematic; bars on numerals are omitted.</text></svg>