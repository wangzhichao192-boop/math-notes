<title id="title">Ramsey number R(3,3)</title><desc id="desc">A complete K5 has red cycle edges and blue diagonals. The K6 argument inspects three neighbours joined in red to u; dashed blue edges indicate the case when all three mutual edges are blue.</desc><style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{fill:none;stroke:#94a3b8;stroke-width:2.5}.red{stroke:#c9363d;stroke-width:4;fill:none}.blue{stroke:#2861b5;stroke-width:3;fill:none}.green{stroke:#16816b;stroke-width:5;fill:none}.dash{stroke-dasharray:8 5}.v{fill:#fff;stroke:#334155;stroke-width:2.5}.new{fill:#dcfce7;stroke:#16816b;stroke-width:3}.txt{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.redtxt{fill:#c9363d}.bluetxt{fill:#2861b5}</style>
