<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title"><title id="title">Initial segments give the ordinal labels</title><style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#e8f3f1;stroke:#4f8b83;stroke-width:2}.node{fill:white;stroke:#334155;stroke-width:2}.line{stroke:#345d78;stroke-width:2.5;fill:none}.arrow{stroke:#345d78;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.title{font:600 24px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.text{font:21px system-ui,sans-serif;fill:#334155;text-anchor:middle}.math{font:25px Georgia,serif;fill:#0f172a;text-anchor:middle}.small{font:18px system-ui,sans-serif;fill:#475569;text-anchor:middle}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#345d78"/></marker></defs><rect x="10" y="10" width="740" height="600" rx="12" class="panel"/><text x="380" y="52" class="title">A position is labelled by everything before it</text><rect x="45" y="110" width="280" height="115" rx="12" class="box"/><text x="185" y="152" class="math">p</text><text x="185" y="195" class="text">Predecessors: ∅</text><path class="arrow" d="M 335 165 L 425 165"/><rect x="435" y="110" width="280" height="115" rx="12" class="box"/><text x="575" y="152" class="math">Ordinal 0</text><text x="575" y="195" class="text">Elements: ∅</text><rect x="45" y="280" width="280" height="115" rx="12" class="box"/><text x="185" y="322" class="math">q</text><text x="185" y="365" class="text">Predecessors: {p}</text><path class="arrow" d="M 335 335 L 425 335"/><rect x="435" y="280" width="280" height="115" rx="12" class="box"/><text x="575" y="322" class="math">Ordinal 1</text><text x="575" y="365" class="text">Elements: {0}</text><rect x="45" y="450" width="280" height="115" rx="12" class="box"/><text x="185" y="492" class="math">r</text><text x="185" y="535" class="text">Predecessors: {p,q}</text><path class="arrow" d="M 335 505 L 425 505"/><rect x="435" y="450" width="280" height="115" rx="12" class="box"/><text x="575" y="492" class="math">Ordinal 2</text><text x="575" y="535" class="text">Elements: {0,1}</text><text x="380" y="592" class="small">Order: p &lt; q &lt; r. Numeral bars are omitted in this figure.</text></svg>