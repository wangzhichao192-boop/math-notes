<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
<title id="title">Infinite Ramsey thinning</title><desc id="desc">Schematic nested infinite reservoirs V0,V1,V2. Edges from wi to every vertex in Vi have its base colour di. The displayed colours are illustrative; infinite pigeonhole yields infinitely many indices with one common base colour.</desc><style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{fill:none;stroke:#94a3b8;stroke-width:2.5}.red{stroke:#c9363d;stroke-width:4;fill:none}.blue{stroke:#2861b5;stroke-width:3;fill:none}.green{stroke:#16816b;stroke-width:5;fill:none}.dash{stroke-dasharray:8 5}.v{fill:#fff;stroke:#334155;stroke-width:2.5}.new{fill:#dcfce7;stroke:#16816b;stroke-width:3}.txt{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.redtxt{fill:#c9363d}.bluetxt{fill:#2861b5}</style>
<rect class="panel" x="10" y="10" width="1060" height="480" rx="14"/><text class="ttl" x="540" y="48">Thin infinite reservoirs, then select one base colour</text><rect x="150" y="85" width="870" height="325" rx="16" fill="#eef2ff" stroke="#7180a7" stroke-width="2"/><text class="small" x="230" y="115">V₀ infinite</text><rect x="405" y="177" width="615" height="233" rx="16" fill="#e0e7ff" stroke="#7180a7" stroke-width="2"/><text class="small" x="485" y="207">V₁ infinite</text><rect x="650" y="269" width="370" height="141" rx="16" fill="#c7d2fe" stroke="#7180a7" stroke-width="2"/><text class="small" x="730" y="299">V₂ infinite</text><line class="red" x1="65" y1="120" x2="185" y2="120"/><circle class="v" cx="65" cy="120" r="9"/><text class="txt" x="38" y="127">w₀</text><text class="small" x="125" y="100">d₀</text><line class="blue" x1="280" y1="225" x2="440" y2="225"/><circle class="v" cx="280" cy="225" r="9"/><text class="txt" x="253" y="232">w₁</text><text class="small" x="360" y="205">d₁</text><line class="red" x1="535" y1="330" x2="685" y2="330"/><circle class="v" cx="535" cy="330" r="9"/><text class="txt" x="508" y="337">w₂</text><text class="small" x="610" y="310">d₂</text><text class="txt" x="825" y="375">V₀ ⊃ V₁ ⊃ V₂ ⊃ ⋯</text><text class="txt" x="540" y="444">For i &lt; j:  wⱼ ∈ Vᵢ  ⇒  c(wᵢwⱼ) = dᵢ</text><text class="small" x="540" y="474">Infinitely many dᵢ coincide; their wᵢ form an infinite monochromatic clique.</text>
</svg>
