<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
<title id="title">Ramsey induction on subset size</title>
<desc id="desc">Fixing xi defines the derived colouring fi(A)=f(A union {xi}). Its infinite homogeneous reservoir contains all later chosen elements. Dashed rays indicate membership in one tuple, not graph edges.</desc>
<style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{fill:none;stroke:#475569;stroke-width:3}.dash{stroke-dasharray:9 6}.red{fill:none;stroke:#c9363d;stroke-width:4}.blue{fill:none;stroke:#2861b5;stroke-width:4}.green{fill:none;stroke:#16816b;stroke-width:4}.v{fill:#fff;stroke:#334155;stroke-width:2.5}.txt{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.redtxt{fill:#c9363d}.bluetxt{fill:#2861b5}</style>
<rect class="panel" x="10" y="10" width="1060" height="400" rx="14"/><text class="ttl" x="540" y="48">Fix one element, then colour the remaining k-subsets</text><circle class="v" cx="120" cy="180" r="9"/><text class="txt" x="120" y="154">xᵢ</text><rect x="430" y="95" width="590" height="235" rx="15" fill="#e0e7ff" stroke="#7180a7" stroke-width="2"/><text class="txt" x="725" y="130">Sᵢ₊₁: infinite and homogeneous for fᵢ</text><line class="red dash" x1="120" y1="180" x2="535" y2="170"/><circle class="v" cx="535" cy="170" r="9"/><text class="txt" x="535" y="145">xᵢ₁</text><line class="red dash" x1="120" y1="180" x2="670" y2="220"/><circle class="v" cx="670" cy="220" r="9"/><text class="txt" x="670" y="195">xᵢ₂</text><line class="red dash" x1="120" y1="180" x2="810" y2="270"/><circle class="v" cx="810" cy="270" r="9"/><text class="txt" x="810" y="298">xᵢₖ</text><text class="ttl" x="740" y="249">⋯</text><text class="small" x="925" y="235">i &lt; i₁ &lt; ⋯ &lt; iₖ</text><text class="txt" x="265" y="290">fᵢ(A) = f(A ∪ {xᵢ})</text><text class="txt" x="540" y="367">f({xᵢ, xᵢ₁, …, xᵢₖ}) = yᵢ</text><text class="small" x="540" y="395">Choose infinitely many indices with the same yᵢ.</text>
</svg>
