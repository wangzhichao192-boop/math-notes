<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title"><title id="title">Replacement, separation, empty set and power set establish pairing</title><style>
.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.node{fill:white;stroke:#334155;stroke-width:2.5}
.edge{fill:none;stroke:#345d78;stroke-width:3;marker-end:url(#arrow)}
.title{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
.label{font:italic 25px Georgia,serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
.text{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}
.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}
.warn{fill:#9a5c13}.soft{fill:#e8f3f1;stroke:#4f8b83;stroke-width:2}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#345d78"/></marker></defs><rect class="panel" x="10" y="10" width="740" height="740" rx="12"/><text class="title" x="380" y="48">Existence proofs without assuming Pairing</text><rect class="soft" x="80" y="80" width="600" height="75" rx="12"/><text class="title" x="380" y="110">Replacement</text><text class="small" x="380" y="138">Images of definable partial functions</text><rect class="soft" x="80" y="200" width="600" height="75" rx="12"/><text class="title" x="380" y="230">Separation</text><text class="small" x="380" y="258">Keep exactly the inputs satisfying a property</text><rect class="soft" x="80" y="320" width="600" height="75" rx="12"/><text class="title" x="380" y="350">Empty set</text><text class="small" x="380" y="378">Separate by the impossible condition x ≠ x</text><rect class="soft" x="80" y="440" width="600" height="125" rx="12"/><text class="title" x="380" y="470">A two-element source D</text><text class="small" x="380" y="498">P(∅) = {∅};   D = P({∅}) = {∅, {∅}}</text><rect class="soft" x="80" y="610" width="600" height="95" rx="12"/><text class="title" x="380" y="640">Pairing: {a,b}</text><text class="small" x="380" y="668">Replacement sends ∅ ↦ a and {∅} ↦ b</text><path class="edge" d="M 380 157 L 380 195"/><path class="edge" d="M 380 277 L 380 315"/><path class="edge" d="M 380 397 L 380 435"/><path class="edge" d="M 380 567 L 380 605"/><text class="small" x="380" y="540">The two inputs are distinct: only {∅} has an element.</text></svg>