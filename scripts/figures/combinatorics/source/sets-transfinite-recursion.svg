<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 645" role="img" aria-labelledby="title"><title id="title">Successor and limit steps in transfinite recursion</title><style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#e8f3f1;stroke:#4f8b83;stroke-width:2}.node{fill:white;stroke:#334155;stroke-width:2}.line{stroke:#345d78;stroke-width:2.5;fill:none}.arrow{stroke:#345d78;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.title{font:600 24px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.text{font:21px system-ui,sans-serif;fill:#334155;text-anchor:middle}.math{font:25px Georgia,serif;fill:#0f172a;text-anchor:middle}.small{font:18px system-ui,sans-serif;fill:#475569;text-anchor:middle}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#345d78"/></marker></defs><rect x="10" y="10" width="740" height="625" rx="12" class="panel"/><text x="380" y="53" class="title">Extending compatible partial functions</text><rect x="45" y="85" width="670" height="210" rx="12" class="box"/><text x="380" y="124" class="title">Successor stage: one new input</text><text x="380" y="173" class="math">f on β  →  f ∪ {(β, H(f))} on β + 1</text><text x="380" y="224" class="text">H reads the entire earlier function f.</text><text x="380" y="260" class="small">The old input-output pairs remain unchanged.</text><rect x="45" y="325" width="670" height="260" rx="12" class="box"/><text x="380" y="366" class="title">Limit stage: join all earlier histories</text><text x="380" y="419" class="math">fδ  ⊆  fε       (δ &lt; ε &lt; λ)</text><text x="380" y="465" class="math">fλ = ⋃δ&lt;λ fδ</text><text x="380" y="511" class="small">Agreement on overlaps makes the union a function.</text><text x="380" y="552" class="small">Replacement first collects the shorter functions.</text><text x="380" y="616" class="small">Only stages inside the specified ordinal are constructed.</text></svg>