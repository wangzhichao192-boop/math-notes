<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 535" role="img" aria-labelledby="title desc">
<title id="title">Ramsey compactness prefix tree</title><desc id="desc">A schematic two-colour prefix tree. Each node extends its parent's edge-colour sequence. The green path consists of nested compatible prefixes. Branches shown do not assert a particular edge enumeration or forbidden clique.</desc><style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{fill:none;stroke:#94a3b8;stroke-width:2.5}.red{stroke:#c9363d;stroke-width:4;fill:none}.blue{stroke:#2861b5;stroke-width:3;fill:none}.green{stroke:#16816b;stroke-width:5;fill:none}.dash{stroke-dasharray:8 5}.v{fill:#fff;stroke:#334155;stroke-width:2.5}.new{fill:#dcfce7;stroke:#16816b;stroke-width:3}.txt{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.redtxt{fill:#c9363d}.bluetxt{fill:#2861b5}</style>
<rect class="panel" x="10" y="10" width="1060" height="515" rx="14"/><text class="ttl" x="540" y="48">Compatible partial colourings form a rooted tree</text><line class="green" x1="540" y1="95" x2="305" y2="200"/><line class="edge" x1="540" y1="95" x2="775" y2="200"/><line class="edge" x1="305" y1="200" x2="175" y2="310"/><line class="green" x1="305" y1="200" x2="420" y2="310"/><line class="edge" x1="775" y1="200" x2="675" y2="310"/><line class="edge" x1="775" y1="200" x2="920" y2="310"/><line class="green" x1="420" y1="310" x2="335" y2="420"/><line class="edge" x1="420" y1="310" x2="515" y2="420"/><line class="green dash" x1="335" y1="438" x2="280" y2="480"/><circle class="new" cx="540" cy="95" r="9"/><text class="txt" x="540" y="123">∅</text><circle class="new" cx="305" cy="200" r="9"/><rect x="273.75" y="209" width="62.5" height="24" rx="3" fill="#f8fafc"/><text class="txt" x="305" y="228">(red)</text><circle class="v" cx="775" cy="200" r="9"/><rect x="738.5" y="209" width="73" height="24" rx="3" fill="#f8fafc"/><text class="txt" x="775" y="228">(blue)</text><circle class="v" cx="175" cy="310" r="9"/><rect x="117.5" y="319" width="115" height="24" rx="3" fill="#f8fafc"/><text class="txt" x="175" y="338">(red, red)</text><circle class="new" cx="420" cy="310" r="9"/><rect x="357.25" y="319" width="125.5" height="24" rx="3" fill="#f8fafc"/><text class="txt" x="420" y="338">(red, blue)</text><circle class="v" cx="675" cy="310" r="9"/><rect x="612.25" y="319" width="125.5" height="24" rx="3" fill="#f8fafc"/><text class="txt" x="675" y="338">(blue, red)</text><circle class="v" cx="920" cy="310" r="9"/><rect x="852" y="319" width="136" height="24" rx="3" fill="#f8fafc"/><text class="txt" x="920" y="338">(blue, blue)</text><circle class="new" cx="335" cy="420" r="9"/><rect x="246" y="429" width="178" height="24" rx="3" fill="#f8fafc"/><text class="txt" x="335" y="448">(red, blue, red)</text><circle class="v" cx="515" cy="420" r="9"/><rect x="420.75" y="429" width="188.5" height="24" rx="3" fill="#f8fafc"/><text class="txt" x="515" y="448">(red, blue, blue)</text><text class="ttl" x="245" y="489">⋯</text><text class="small" x="92" y="95">level 0</text><text class="small" x="92" y="200">level 1</text><text class="small" x="92" y="300">level 2</text><text class="small" x="92" y="407">level 3</text><text class="txt" x="820" y="425">level ℓ has ≤ k<tspan baseline-shift="super" font-size="14">ℓ</tspan> nodes</text><text class="small" x="740" y="473">Schematic branches: retain only admissible prefixes.</text><text class="small" x="740" y="502">The green path determines one full edge colouring.</text>
</svg>
