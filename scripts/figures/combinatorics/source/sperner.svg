<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">A Sperner coloring of a triangulated triangle</title>
  <desc id="desc">Boundary vertices use only the colors allowed by the endpoints of their side. A small interior triangle with labels one, two, and three is highlighted.</desc>
  <defs>
    <style>
      .tri{fill:#f8fafc;stroke:#334155;stroke-width:4}.grid{stroke:#94a3b8;stroke-width:2;fill:none}.one{fill:#fee2e2;stroke:#dc2626}.two{fill:#dbeafe;stroke:#2563eb}.three{fill:#dcfce7;stroke:#16a34a}.node{stroke-width:3}.num{font:700 17px system-ui,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}.ttl{font:600 24px system-ui,sans-serif;fill:#0f172a}.lbl{font:19px system-ui,sans-serif;fill:#334155;text-anchor:middle}.hi{fill:#fde68a;stroke:#d97706;stroke-width:6;opacity:.7}
    </style>
  </defs>
  <text class="ttl" x="380" y="35" text-anchor="middle">A valid Sperner coloring</text>
  <path class="tri" d="M380 55L80 430H680Z"/>
  <path class="grid" d="M320 130H440 M260 205H500 M200 280H560 M140 355H620 M80 430H680 M380 55L320 130 M380 55L440 130 M320 130L260 205 M320 130L380 205 M440 130L380 205 M440 130L500 205 M260 205L200 280 M260 205L320 280 M380 205L320 280 M380 205L440 280 M500 205L440 280 M500 205L560 280 M200 280L140 355 M200 280L260 355 M320 280L260 355 M320 280L380 355 M440 280L380 355 M440 280L500 355 M560 280L500 355 M560 280L620 355 M140 355L80 430 M140 355L200 430 M260 355L200 430 M260 355L320 430 M380 355L320 430 M380 355L440 430 M500 355L440 430 M500 355L560 430 M620 355L560 430 M620 355L680 430"/>
  <path class="hi" d="M380 205L320 280H440Z"/>
  <g>
    <circle class="node one" cx="380" cy="55" r="14"/><text class="num" x="380" y="55">1</text>
    <circle class="node one" cx="320" cy="130" r="14"/><text class="num" x="320" y="130">1</text><circle class="node one" cx="440" cy="130" r="14"/><text class="num" x="440" y="130">1</text>
    <circle class="node two" cx="260" cy="205" r="14"/><text class="num" x="260" y="205">2</text><circle class="node one" cx="380" cy="205" r="14"/><text class="num" x="380" y="205">1</text><circle class="node three" cx="500" cy="205" r="14"/><text class="num" x="500" y="205">3</text>
    <circle class="node two" cx="200" cy="280" r="14"/><text class="num" x="200" y="280">2</text><circle class="node two" cx="320" cy="280" r="14"/><text class="num" x="320" y="280">2</text><circle class="node three" cx="440" cy="280" r="14"/><text class="num" x="440" y="280">3</text><circle class="node three" cx="560" cy="280" r="14"/><text class="num" x="560" y="280">3</text>
    <circle class="node two" cx="140" cy="355" r="14"/><text class="num" x="140" y="355">2</text><circle class="node two" cx="260" cy="355" r="14"/><text class="num" x="260" y="355">2</text><circle class="node three" cx="380" cy="355" r="14"/><text class="num" x="380" y="355">3</text><circle class="node three" cx="500" cy="355" r="14"/><text class="num" x="500" y="355">3</text><circle class="node three" cx="620" cy="355" r="14"/><text class="num" x="620" y="355">3</text>
    <circle class="node two" cx="80" cy="430" r="14"/><text class="num" x="80" y="430">2</text><circle class="node two" cx="200" cy="430" r="14"/><text class="num" x="200" y="430">2</text><circle class="node two" cx="320" cy="430" r="14"/><text class="num" x="320" y="430">2</text><circle class="node three" cx="440" cy="430" r="14"/><text class="num" x="440" y="430">3</text><circle class="node three" cx="560" cy="430" r="14"/><text class="num" x="560" y="430">3</text><circle class="node three" cx="680" cy="430" r="14"/><text class="num" x="680" y="430">3</text>
  </g>
  <text class="lbl" x="380" y="480">The highlighted small triangle has all three labels.</text>
</svg>
