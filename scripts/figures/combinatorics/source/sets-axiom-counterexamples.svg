<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" role="img" aria-labelledby="title"><title id="title">Small graphs distinguish three axioms</title><style>
.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.node{fill:white;stroke:#334155;stroke-width:2.5}
.edge{fill:none;stroke:#345d78;stroke-width:3;marker-end:url(#arrow)}
.title{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
.label{font:italic 25px Georgia,serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
.text{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}
.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}
.warn{fill:#9a5c13}.soft{fill:#e8f3f1;stroke:#4f8b83;stroke-width:2}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#345d78"/></marker></defs><rect class="panel" x="10" y="10" width="740" height="245" rx="12"/><text class="title" x="510" y="68">Extensionality fails</text><path class="edge" d="M 233.63946767633786 167.27703843935817 L 177.5291417753523 89.34603024354483"/><path class="edge" d="M 222.0 190.0 L 100.0 190.0"/><circle class="node" cx="160" cy="65" r="25"/><text class="label" x="160" y="66">a</text><circle class="node" cx="70" cy="190" r="25"/><text class="label" x="70" y="191">b</text><circle class="node" cx="250" cy="190" r="25"/><text class="label" x="250" y="191">c</text><text class="text" x="510" y="125">a and b have no elements.</text><text class="text" x="510" y="165">Distinct vertices, equal El.</text><rect class="panel" x="10" y="270" width="740" height="245" rx="12"/><text class="title" x="510" y="328">Pairing fails</text><path class="edge" d="M 143.63946767633786 347.72296156064186 L 87.52914177535229 425.6539697564552"/><path class="edge" d="M 176.36053232366214 347.72296156064186 L 232.4708582246477 425.6539697564552"/><path class="edge" d="M 98.0 450.0 L 220.0 450.0"/><circle class="node" cx="160" cy="325" r="25"/><text class="label" x="160" y="326">a</text><circle class="node" cx="70" cy="450" r="25"/><text class="label" x="70" y="451">b</text><circle class="node" cx="250" cy="450" r="25"/><text class="label" x="250" y="451">c</text><text class="text" x="510" y="385">No vertex has elements {a,c}.</text><text class="text" x="510" y="425">Extensionality does hold.</text><rect class="panel" x="10" y="530" width="740" height="245" rx="12"/><text class="title" x="510" y="588">Union fails</text><path class="edge" d="M 143.63946767633786 607.7229615606418 Q 102.82698487822759 638.7354291123239 87.52914177535229 685.6539697564551"/><path class="edge" d="M 176.36053232366214 607.7229615606418 Q 192.8269848782276 656.2645708876761 232.4708582246477 685.6539697564551"/><path class="edge" d="M 86.36053232366213 687.2770384393582 Q 127.17301512177241 656.2645708876761 142.4708582246477 609.3460302435449"/><path class="edge" d="M 98.0 710.0 Q 160.0 725.0 220.0 710.0"/><path class="edge" d="M 233.63946767633786 687.2770384393582 Q 217.1730151217724 638.7354291123239 177.5291417753523 609.3460302435449"/><path class="edge" d="M 222.0 710.0 Q 160.0 695.0 100.0 710.0"/><circle class="node" cx="160" cy="585" r="25"/><text class="label" x="160" y="586">a</text><circle class="node" cx="70" cy="710" r="25"/><text class="label" x="70" y="711">b</text><circle class="node" cx="250" cy="710" r="25"/><text class="label" x="250" y="711">c</text><text class="text" x="510" y="645">Two steps reach all a,b,c.</text><text class="text" x="510" y="685">No vertex has all three elements.</text></svg>