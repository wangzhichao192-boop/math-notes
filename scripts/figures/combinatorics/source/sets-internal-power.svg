<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 460" role="img" aria-labelledby="title"><title id="title">The internal power-set axiom collects represented subsets</title><style>
.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.node{fill:white;stroke:#334155;stroke-width:2.5}
.edge{fill:none;stroke:#345d78;stroke-width:3;marker-end:url(#arrow)}
.title{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
.label{font:italic 25px Georgia,serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
.text{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}
.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}
.warn{fill:#9a5c13}.soft{fill:#e8f3f1;stroke:#4f8b83;stroke-width:2}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#345d78"/></marker></defs><rect class="panel" x="10" y="10" width="1000" height="440" rx="12"/><text class="title" x="510" y="49">Existing internal subsets versus external descriptions</text><path class="edge" d="M 148.0 200.0 L 270.0 200.0"/><path class="edge" d="M 325.84615384615387 189.23076923076923 L 452.3076923076923 136.53846153846155"/><path class="edge" d="M 325.5867233613672 211.37187704949653 L 452.5856535413923 267.8158460183966"/><circle class="node" cx="120" cy="200" r="25"/><text class="label" x="120" y="201">p</text><circle class="node" cx="300" cy="200" r="25"/><text class="label" x="300" y="201">c</text><circle class="node" cx="480" cy="125" r="25"/><text class="label" x="480" y="126">a</text><circle class="node" cx="480" cy="280" r="25"/><text class="label" x="480" y="281">b</text><text class="small" x="120" y="260">P(c)</text><text class="small" x="300" y="315">El(c) = {a,b}meta</text><path class="edge" stroke-dasharray="5 6" d="M 502 112 L 560 82"/><path class="edge" stroke-dasharray="5 6" d="M 502 290 L 560 326"/><text class="small" x="430" y="380">Other elements of a,b are not shown.</text><rect x="630" y="95" width="345" height="230" rx="12" fill="white" stroke="#b59563" stroke-width="2" stroke-dasharray="7 6"/><text class="small" x="802" y="138">External subset descriptions</text><text class="text" x="802" y="185">∅meta    {a}meta    {b}meta</text><text class="small" x="802" y="240">Their representatives have</text><text class="small" x="802" y="270">not yet been established.</text><text class="small" x="510" y="420">Conditional case: if c is the only internal subset of c, then El(P(c)) = {c}meta.</text></svg>