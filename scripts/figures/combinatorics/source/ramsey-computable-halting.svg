<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
<title id="title">Computable triple colouring</title>
<desc id="desc">For a blue homogeneous set, each interval (tn,tn+1] needs a new first halt from a fixed finite set of programs. A red homogeneous set provides a bound te+1 for every computation Pe(e).</desc>
<style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{fill:none;stroke:#475569;stroke-width:3}.dash{stroke-dasharray:9 6}.red{fill:none;stroke:#c9363d;stroke-width:4}.blue{fill:none;stroke:#2861b5;stroke-width:4}.green{fill:none;stroke:#16816b;stroke-width:4}.v{fill:#fff;stroke:#334155;stroke-width:2.5}.txt{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.redtxt{fill:#c9363d}.bluetxt{fill:#2861b5}</style>
<rect class="panel" x="10" y="10" width="1060" height="420" rx="14"/><text class="ttl" x="540" y="48">Blue requires new halts; red bounds all later first halts</text><text class="txt bluetxt" x="540" y="88">Blue: fix the first member t₀; witnesses have eₙ ≤ t₀</text><rect x="155" y="126" width="200" height="72" fill="#e0e7ff" rx="8"/><text class="small" x="255" y="160">first halt of e₁</text><rect x="365" y="126" width="210" height="72" fill="#dbeafe" rx="8"/><text class="small" x="470" y="160">first halt of e₂</text><rect x="585" y="126" width="210" height="72" fill="#e0e7ff" rx="8"/><text class="small" x="690" y="160">first halt of e₃</text><rect x="805" y="126" width="180" height="72" fill="#dbeafe" rx="8"/><text class="small" x="895" y="160">first halt of e₄</text><line class="edge" x1="110" y1="170" x2="1030" y2="170"/><line class="edge" x1="150" y1="164" x2="150" y2="176"/><text class="txt" x="150" y="226">t₁</text><line class="edge" x1="360" y1="164" x2="360" y2="176"/><text class="txt" x="360" y="226">t₂</text><line class="edge" x1="580" y1="164" x2="580" y2="176"/><text class="txt" x="580" y="226">t₃</text><line class="edge" x1="800" y1="164" x2="800" y2="176"/><text class="txt" x="800" y="226">t₄</text><line class="edge" x1="990" y1="164" x2="990" y2="176"/><text class="txt" x="990" y="226">t₅</text><text class="small" x="540" y="265">Disjoint intervals need distinct witnesses from {0, …, t₀}.</text><rect x="50" y="290" width="980" height="97" rx="12" fill="#fee2e2"/><text class="txt redtxt" x="540" y="321">Red: choose tₑ ≥ e</text><text class="txt" x="540" y="352">Pₑ(e) halts eventually  ⇔  Pₑ(e) halts by tₑ₊₁</text><text class="small" x="540" y="378">A computable T would provide a computable bound and decide H.</text>
</svg>
