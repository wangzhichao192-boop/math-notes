<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
<title id="title">Schur's theorem from a triangle</title><desc id="desc">For a&lt;b&lt;d, triangle edges are coloured by the colours of b-a, d-b, and d-a. A monochromatic triangle yields same-colour positive integers x,y,z with x+y=z.</desc><style>.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.edge{fill:none;stroke:#94a3b8;stroke-width:2.5}.red{stroke:#c9363d;stroke-width:4;fill:none}.blue{stroke:#2861b5;stroke-width:3;fill:none}.green{stroke:#16816b;stroke-width:5;fill:none}.dash{stroke-dasharray:8 5}.v{fill:#fff;stroke:#334155;stroke-width:2.5}.new{fill:#dcfce7;stroke:#16816b;stroke-width:3}.txt{font:20px system-ui,sans-serif;fill:#334155;text-anchor:middle}.small{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.ttl{font:600 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.redtxt{fill:#c9363d}.bluetxt{fill:#2861b5}</style>
<rect class="panel" x="10" y="10" width="1060" height="360" rx="14"/><text class="ttl" x="540" y="50">A monochromatic triangle encodes x + y = z</text><line class="red" x1="180" y1="280" x2="540" y2="105"/><line class="red" x1="540" y1="105" x2="900" y2="280"/><line class="red" x1="180" y1="280" x2="900" y2="280"/><circle class="v" cx="180" cy="280" r="9"/><text class="txt" x="180" y="315">a</text><circle class="v" cx="540" cy="105" r="9"/><text class="txt" x="540" y="78">b</text><circle class="v" cx="900" cy="280" r="9"/><text class="txt" x="900" y="315">d</text><text class="txt redtxt" x="345" y="158">x = b − a</text><text class="txt redtxt" x="735" y="158">y = d − b</text><text class="txt redtxt" x="540" y="265">z = d − a</text><text class="small" x="540" y="345">a &lt; b &lt; d; all three differences lie in [M − 1]</text>
</svg>
